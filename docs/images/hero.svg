<g><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.9417;0.9833;1"/><g clip-path="url(#c1)"><text x="688" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#1b1b19" text-anchor="start" >Why the printing press mattered</text></g><g clip-path="url(#c2)"><text x="688" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#1b1b19" text-anchor="start" >The printing press changed how ideas moved.</text></g><g clip-path="url(#c3)"><text x="688" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#1b1b19" text-anchor="start" >Before it, a book was copied by hand, and one</text></g><g clip-path="url(#c4a)"><text x="688" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#1b1b19" text-anchor="start" >slip could live on for </text></g><g clip-path="url(#c4b)"><g><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="1;1;1;0;0" keyTimes="0;0.6167;0.6417;0.6708;1"/><rect x="860.4" y="272" width="81.3" height="24" rx="4" fill="#fbe4df" opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6083;0.6708"/></rect><text x="862.4" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1b1b19">centuries<animate attributeName="fill" dur="12.0s" repeatCount="indefinite" calcMode="discrete" values="#1b1b19;#c8382a;#1b1b19" keyTimes="0;0.6083;0.6708"/></text><rect x="862.4" y="283" width="77.3" height="1.6" fill="#c8382a" opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6083;0.6708"/></rect></g></g><g clip-path="url(#c4c)"><text x="862.4" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#1b1b19" text-anchor="start" >generations.</text></g><g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7833"/><rect x="818.1" y="319" width="279.8" height="26" rx="4" fill="#e3f1ea"/><rect x="684" y="353" width="281.1" height="26" rx="4" fill="#e3f1ea"/><rect x="688" y="322" width="124.1" height="22" rx="11" fill="#1a7f5a"/><text x="698" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start" >Pasted · 112 chars</text><text x="822.1" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#1b1b19" text-anchor="start" >“The art of printing preserves all</text><text x="688" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#1b1b19" text-anchor="start" >other arts,” as one printer wrote.</text></g><rect y="155" width="2" height="22" rx="1" fill="#1a7f5a" x="688" opacity="0"><animate attributeName="x" dur="12.0s" repeatCount="indefinite" values="688;688;1042.4;1042.4" keyTimes="0.0000;0.0250;0.1333;1.0000"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0250;0.1625"/></rect><rect y="205" width="2" height="22" rx="1" fill="#1a7f5a" x="688" opacity="0"><animate attributeName="x" dur="12.0s" repeatCount="indefinite" values="688;688;1072.8;1072.8" keyTimes="0.0000;0.1667;0.3000;1.0000"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1625;0.3042"/></rect><rect y="239" width="2" height="22" rx="1" fill="#1a7f5a" x="688" opacity="0"><animate attributeName="x" dur="12.0s" repeatCount="indefinite" values="688;688;1071.8;1071.8" keyTimes="0.0000;0.3083;0.4417;1.0000"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3042;0.4458"